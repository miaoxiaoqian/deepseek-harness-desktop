<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: -apple-system, "SF Mono", "JetBrains Mono", Menlo, monospace;
    }
    #terminal {
      position: absolute;
      inset: 0;
      padding: 10px 12px;
      box-sizing: border-box;
    }
    /* Loading veil shown until the PTY streams its first byte */
    #veil {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #8aa0c0;
      background: #0b1020;
      z-index: 10;
      transition: opacity .4s ease;
    }
    #veil.hidden { opacity: 0; pointer-events: none; }
    .whale { font-size: 46px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
    .status { font-size: 13px; letter-spacing: .5px; }
    .dot { animation: blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
  </style>
</head>
<body>
  <div id="veil">
    <div class="whale">🐳</div>
    <div class="status">正在启动 DeepSeek Harness 终端引擎<span class="dot">...</span></div>
  </div>
  <div id="terminal"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="./terminal.js"></script>
</body>
</html>
